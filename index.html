<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/src/assets/codeApi.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    
</head>

<body style="background-color: #02040e;background: radial-gradient(circle, rgba(6,8,23,1) 0%, rgba(2,4,14,1) 80%);">
    <div id="particles-js"></div>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <div id="app" style="z-index: 10"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": {
                    "value": 80,
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    "value": "#d10707"
                },
                "shape": {
                    "type": "circle"
                },
                "opacity": {
                    "value": 0.4,
                    "random": false
                },
                "size": {
                    "value": 3,
                    "random": true
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#ffffff",
                    "opacity": 0.2,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 3,
                    "direction": "none",
                    "random": false,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "grab"
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push"
                    },
                    "resize": true
                },
                "modes": {
                    "grab": {
                        "distance": 200,
                        "line_linked": {
                            "opacity": 1
                        }
                    },
                    "push": {
                        "particles_nb": 4
                    }
                }
            },
            "retina_detect": true
        });
    </script>
</body>



<style scoped>
    /* ---- reset ---- */ 
    body { 
        margin:0; 
        font:normal 75% Arial, Helvetica, sans-serif; 
    } 
    canvas { 
        display: block; 
        vertical-align: bottom; 
    } 
    /* ---- particles.js container ---- */ 
    #particles-js { 
        position:fixed; 
        width:100%; 
        height: 100%; 
        background-color: #02040e; 
    } 
    @media (max-width: 750px) {
        body {
           width: 100%;
           height: auto;
        }
    }
</style>

</html>
